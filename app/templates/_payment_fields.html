{# venda parcelada (recurso "pagamento_parcelado"): forma de pagamento, entrada e parcelas. Variável: lead #}
<span class="pay-fields">
  <label>Pagamento
    <select name="pay_mode" class="pay-mode">
      <option value="" {{ "selected" if not lead.pay_mode }}>—</option>
      <option value="avista" {{ "selected" if lead.pay_mode == "avista" }}>À vista</option>
      <option value="parcelado" {{ "selected" if lead.pay_mode == "parcelado" }}>Parcelado</option>
    </select>
  </label>
  <span class="pay-parcelado" {{ "hidden" if lead.pay_mode == "avista" }}>
    <label>Entrada R$ <input name="down_payment" class="money" inputmode="decimal" autocomplete="off" placeholder="0 = sem entrada" value="{{ lead.down_payment|brl if lead.down_payment is not none else '' }}"></label>
    <span class="pay-inst"><label>Parcelas <input name="installments" inputmode="numeric" autocomplete="off" placeholder="60" style="width:56px" value="{{ lead.installments or '' }}"></label>
    <label>x R$ <input name="installment_value" class="money" inputmode="decimal" autocomplete="off" placeholder="valor" value="{{ lead.installment_value|brl if lead.installment_value else '' }}"></label></span>
  </span>
</span>
