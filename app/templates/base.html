<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}CRM{% endblock %} · {{ tenant.name if tenant else "" }}</title>
  <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <img class="logo-img" src="/static/brand/logo-horizontal-amarelo.svg" alt="Junta">
    <nav>
      <a href="/" class="{{ 'active' if active_nav == 'pipeline' else '' }}">Pipeline</a>
      <a href="/inbox" class="{{ 'active' if active_nav == 'inbox' else '' }}">Inbox</a>
      <a href="/dashboard" class="{{ 'active' if active_nav == 'dashboard' else '' }}">Dashboard</a>
    </nav>
    <div class="user">
      <span>{{ tenant.name }} · {{ user.name }}</span>
      <form method="post" action="/logout"><button class="btn ghost small" type="submit">Sair</button></form>
    </div>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
