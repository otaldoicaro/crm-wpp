{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    {{ theme_for(tenant).logo_login }}
    <h2>Entrar</h2>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <p><label>E-mail<br><input type="email" name="email" required></label></p>
      <p><label>Senha<br><input type="password" name="password" required></label></p>
      <button class="btn" type="submit" style="width:100%">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
