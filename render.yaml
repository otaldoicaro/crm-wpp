# Configuração do Render (Blueprint): New + > Blueprint > escolha este repositório.
services:
  - type: web
    name: crm-junta
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_DOMAIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        sync: false  # "1" enquanto testamos sem subdominio real (onrender.com); "0" em producao com dominio proprio
      - key: ADMIN_SETUP_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: META_CAPI_ACCESS_TOKEN
        sync: false
      - key: META_ADS_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CUSTOMER_ID
        sync: false
      - key: GOOGLE_ADS_CONVERSION_ACTION_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
